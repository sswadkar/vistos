<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vistos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              figmaBg: "#ececec",
              figmaInk: "#3f4f68",
              figmaMuted: "#7e8898",
              figmaArrow: "#d7dde7",
              figmaArrowInk: "#4b5b72",
              figmaPurple: "#7d09e0",
              figmaTeal: "#0f8b83",
              figmaBlue: "#254ad7",
              figmaDark: "#33425b",
              figmaGreen: "#138a52",
              figmaRed: "#b84242",
            },
          },
        },
      };
    </script>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const redirected = params.get("__gh_redirect");
        if (!redirected) return;
        params.delete("__gh_redirect");
        const extra = params.toString();
        const target = decodeURIComponent(redirected);
        if (extra) {
          const joiner = target.includes("?") ? "&" : "?";
          window.history.replaceState(null, "", `${target}${joiner}${extra}`);
          return;
        }
        window.history.replaceState(null, "", target);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
